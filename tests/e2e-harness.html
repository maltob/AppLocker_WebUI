<!doctype html>
<html lang="en">
  <head>

    <style>
      :root { font-family: ui-monospace, SFMono-Regular, Consolas, monospace; color: #18241f; background: #f4f6f5; }

    <h1>Policy Studio end-to-end harness</h1>

    <div id="results"></div>
    <iframe id="appFrame" title="Application under test" src="../index.html?test=1&harness=12"></iframe>
